<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL 단축기 - 간편하고 빠른 링크 단축 서비스</title>
  <meta name="description" content="긴 URL을 깔끔하고 짧은 링크로 즉시 변환해 주는 OpenAPI 기반 무료 URL 단축 서비스입니다. 원클릭 복사 및 QR코드 연계 기능을 제공합니다.">
  
  <!-- Open Graph -->
  <meta property="og:title" content="URL 단축기 - 간편하고 빠른 링크 단축 서비스">
  <meta property="og:description" content="긴 주소를 한 번의 클릭으로 깔끔하게 줄이고 쉽게 공유해 보세요.">
  <meta property="og:type" content="website">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="img/logo.png">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Ambient Dynamic Gradient Background -->
  <div class="ambient-background" id="ambientBg" aria-hidden="true">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>
    <div class="orb-mouse-aura" id="mouseAura"></div>
  </div>
  <div class="pattern-overlay" aria-hidden="true"></div>

  <!-- Header Section with Navigation -->
  <header class="app-header">
    <a href="../index.html" class="logo-container" id="logoHomeBtn" title="메인 허브로 이동">
      <div class="logo-badge">
        <img src="img/logo.png" alt="URL Service 로고">
      </div>
      <div class="brand-text-wrap">
        <h1 class="brand-title">URL<span class="highlight">Short</span></h1>
        <span class="brand-desc">스마트 URL 단축 서비스</span>
      </div>
    </a>

    <!-- Navigation Switcher Buttons -->
    <nav class="nav-switch-group" aria-label="서비스 전환">
      <a href="../url2qr/index.html" class="nav-btn" id="navBtnQr" title="QR코드 생성기로 이동">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <span>QR코드</span>
      </a>
      <a href="index.html" class="nav-btn active" id="navBtnShort" title="현재 서비스: URL단축" aria-current="page">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
        </svg>
        <span>URL단축</span>
      </a>
    </nav>
  </header>

  <!-- Main Container -->
  <main class="main-wrapper">
    <div class="app-card-wrapper">
      
      <!-- Intro Section -->
      <section class="intro-section">
        <div class="badge-pill">
          <span class="badge-icon">⚡</span>
          <span>OpenAPI 초고속 단축</span>
        </div>
        <h2 class="page-title">길고 복잡한 URL을<br><span class="gradient-text">깔끔하고 짧게</span> 줄여보세요</h2>
        <p class="page-subtitle">단축할 웹 주소를 입력하면 OpenAPI를 통해 즉시 짧은 링크로 변환됩니다.<br>클릭 한 번으로 손쉽게 복사하거나 QR코드로 연동할 수 있어요.</p>
      </section>

      <!-- URL Shortener Form Card -->
      <section class="shortener-card" aria-label="URL 단축 기능 카드">
        
        <!-- 3-1: URL 입력 상단 라벨 바 -->
        <div class="input-label-bar">
          <label for="urlInput" class="input-label">URL 입력</label>
          <span class="input-hint-tag">원문 주소</span>
        </div>

        <!-- Input Row -->
        <form class="url-input-form" id="shortenForm" autocomplete="off" onsubmit="return false;">
          <div class="input-field-group">
            <div class="input-icon-box" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="2" y1="12" x2="22" y2="12"></line>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
              </svg>
            </div>
            
            <!-- 3-1: URL 입력창 -->
            <input 
              type="text" 
              class="url-input-control" 
              id="urlInput" 
              placeholder="단축할 URL을 입력하세요 (예: https://example.com/very/long/path...)"
              aria-label="단축할 URL 입력창"
              autofocus
            >

            <!-- Input Clear Button -->
            <button type="button" class="btn-clear" id="btnClearInput" title="입력 지우기" aria-label="입력 지우기" style="display: none;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>

          <!-- 3-1 & 3-2: 단축하기 버튼 (입력 필드가 비어있으면 disabled) -->
          <button type="submit" class="btn-shorten" id="btnShorten" disabled>
            <span class="btn-content">
              <svg class="icon-link" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
              </svg>
              <span class="btn-text">단축하기</span>
            </span>
            <span class="btn-spinner" aria-hidden="true" style="display: none;"></span>
          </button>
        </form>

        <!-- Error Message Notice -->
        <div class="error-notice" id="errorNotice" role="alert" style="display: none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span id="errorMessageText">유효한 URL을 입력해 주세요. (예: https://example.com)</span>
        </div>

        <!-- 3-1, 3-3, 3-4: 단축 결과 출력 영역 (읽기 전용 출력 상자 + 복사 버튼) -->
        <div class="result-section" id="resultSection" aria-live="polite">
          <div class="result-label-bar">
            <span class="result-label">단축된 URL 결과</span>
            <span class="result-status-tag" id="resultStatusTag">단축 완료</span>
          </div>

          <div class="result-box-container">
            <div class="output-icon-box" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 11 12 14 22 4"></polyline>
                <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
              </svg>
            </div>
            
            <!-- 3-1 & 3-3: 읽기 전용 출력 상자 -->
            <input 
              type="text" 
              class="url-output-control" 
              id="shortUrlOutput" 
              readonly 
              placeholder="단축된 URL이 여기에 표시됩니다" 
              aria-label="단축된 URL 출력 상자 (읽기 전용)"
            >

            <!-- 3-4: 복사 버튼 -->
            <button type="button" class="btn-copy" id="btnCopy" title="단축된 URL 복사" aria-label="단축된 URL 클립보드 복사">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              <span>복사</span>
            </button>
          </div>

          <!-- Result Extra Quick Actions -->
          <div class="result-actions-row">
            <a href="#" target="_blank" rel="noopener noreferrer" class="btn-action-link" id="btnOpenUrl" title="새 탭에서 바로 열기">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                <polyline points="15 3 21 3 21 9"></polyline>
                <line x1="10" y1="14" x2="21" y2="3"></line>
              </svg>
              <span>바로 열기</span>
            </a>

            <button type="button" class="btn-action-link" id="btnMakeQr" title="이 단축 URL로 QR코드 만들기">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
              </svg>
              <span>QR코드로 만들기</span>
            </button>
          </div>

        </div>

        <!-- History Section (Recent Shortened Links) -->
        <div class="history-section" id="historySection" style="display: none;">
          <div class="history-header">
            <span class="history-title">최근 단축한 링크 내역</span>
            <button type="button" class="btn-clear-history" id="btnClearHistory">내역 삭제</button>
          </div>
          <ul class="history-list" id="historyList"></ul>
        </div>

      </section>

    </div>
  </main>

  <!-- 3-4: '복사하였습니다.' Toast 알림창 -->
  <div class="toast-container" id="toastContainer" role="status" aria-live="polite">
    <div class="toast-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <span class="toast-message" id="toastMessage">복사하였습니다.</span>
  </div>

  <!-- Custom Alert Modal (for explicit alert fallback or visual wow) -->
  <div class="alert-modal-backdrop" id="alertModal" aria-hidden="true" style="display: none;">
    <div class="alert-modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-icon-circle">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <h3 class="modal-title" id="modalTitle">알림</h3>
      <p class="modal-body" id="modalMessage">복사하였습니다.</p>
      <button type="button" class="btn-modal-confirm" id="btnModalConfirm">확인</button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/app.js"></script>
</body>
</html>
